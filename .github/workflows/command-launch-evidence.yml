name: Command launch evidence
on:
  push:
    branches: [agent/command-launch-evidence]
permissions:
  contents: read
jobs:
  python-sdk:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install mcp==2.2.0
      - run: python scripts/research/python-command-launch.py
