name: HTTP host prototype
on:
  push:
    branches: [agent/http-host-prototype]
permissions:
  contents: read
jobs:
  reachability:
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/research/http-host-platforms.mjs
      - run: node scripts/research/http-host-fixtures.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.os }}-${{ matrix.node }}
          path: |
            reports/http-host/
            reports/http-host-fixtures/

  codex:
    name: Native Codex (${{ matrix.os }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: codex-x86_64-unknown-linux-musl
          - os: windows-latest
            binary: codex-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install pinned Codex
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CODEX_VERSION: 0.155.1
          CODEX_BINARY: ${{ matrix.binary }}
        run: |
          curl --fail --location "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/${CODEX_BINARY}.tar.gz" --output codex.tar.gz
          tar -xzf codex.tar.gz
      - name: Check native loading and reporting
        shell: bash
        env:
          CODEX_BINARY: ${{ matrix.binary }}
        run: node scripts/smoke-codex.mjs "$RUNNER_TEMP/$CODEX_BINARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-${{ matrix.os }}
          path: reports/codex/
